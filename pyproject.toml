[project]
name = "bluesky-feed-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=2.3.2,<3",
    "gunicorn>=21.2.0,<23",
    "atproto>=0.0.62,<0.1",
    "peewee>=3.16.2,<4",
    "SudachiPy==0.6.7",
    "SudachiDict-core==20230927",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
